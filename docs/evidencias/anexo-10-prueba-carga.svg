<svg xmlns="http://www.w3.org/2000/svg" width="746" height="841" viewBox="0 0 746 841"><rect width="100%" height="100%" rx="8" fill="#1B1E24"/><rect width="100%" height="30" rx="8" fill="#2A2E36"/><rect y="22" width="100%" height="8" fill="#2A2E36"/><circle cx="16" cy="15" r="5" fill="#E8705F"/><circle cx="34" cy="15" r="5" fill="#E8C06F"/><circle cx="52" cy="15" r="5" fill="#6FCF83"/><text x="78" y="20" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#8A9099">prueba de carga — gRPC contra REST</text><text x="16" y="52" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#D7DAE0" xml:space="preserve">$ node scripts/prueba-carga.js --concurrencia 100 --duracion 8</text><text x="16" y="71" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#D7DAE0" xml:space="preserve"></text><text x="16" y="90" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#D7DAE0" xml:space="preserve">Prueba de carga - Pastas Frescas La Nonna</text><text x="16" y="109" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#D7DAE0" xml:space="preserve">  entorno: Node v26.0.0 sobre Darwin 25.6.0 (arm64)</text><text x="16" y="128" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#D7DAE0" xml:space="preserve">  maquina: 18 nucleos, 24.0 GB de RAM</text><text x="16" y="147" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#D7DAE0" xml:space="preserve">  parametros: concurrencia 100, duracion 8 s por escenario</text><text x="16" y="166" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#D7DAE0" xml:space="preserve">  objetivos: p95 &lt; 200 ms, 500 req/s, 0% errores</text><text x="16" y="185" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#D7DAE0" xml:space="preserve"></text><text x="16" y="204" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#D7DAE0" xml:space="preserve">  A1. Catalogo por el API Gateway (con limite de solicitudes activo)</text><text x="16" y="223" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#D7DAE0" xml:space="preserve">    solicitudes 255394  aceptadas 120  rechazadas por limite 255274 (99.95%)  errores 0 (0%)</text><text x="16" y="242" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#D7DAE0" xml:space="preserve">    p50 14.77 ms   p95 17.15 ms   p99 17.38 ms   max 17.64 ms</text><text x="16" y="261" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#D7DAE0" xml:space="preserve">    throughput 31920.3 req/s</text><text x="16" y="280" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#D7DAE0" xml:space="preserve"></text><text x="16" y="299" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#D7DAE0" xml:space="preserve">  A2. Catalogo en el servicio interno (capacidad sin el limite)</text><text x="16" y="318" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#D7DAE0" xml:space="preserve">    solicitudes 91146  aceptadas 91146  rechazadas por limite 0 (0%)  errores 0 (0%)</text><text x="16" y="337" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#D7DAE0" xml:space="preserve">    p50 8.24 ms   p95 11.69 ms   p99 16.62 ms   max 403.6 ms</text><text x="16" y="356" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#D7DAE0" xml:space="preserve">    throughput 11381.9 req/s</text><text x="16" y="375" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#D7DAE0" xml:space="preserve"></text><text x="16" y="394" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#D7DAE0" xml:space="preserve">  B. Reserva de stock por gRPC (unary, con deadline)</text><text x="16" y="413" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#D7DAE0" xml:space="preserve">    solicitudes 30000  aceptadas 30000  rechazadas por limite 0 (0%)  errores 0 (0%)</text><text x="16" y="432" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#D7DAE0" xml:space="preserve">    p50 25.94 ms   p95 30.18 ms   p99 31.84 ms   max 61.59 ms</text><text x="16" y="451" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#D7DAE0" xml:space="preserve">    throughput 3739.7 req/s</text><text x="16" y="470" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#D7DAE0" xml:space="preserve"></text><text x="16" y="489" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#D7DAE0" xml:space="preserve">  C. La misma reserva por REST (alternativa descartada)</text><text x="16" y="508" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#D7DAE0" xml:space="preserve">    solicitudes 34423  aceptadas 34423  rechazadas por limite 0 (0%)  errores 0 (0%)</text><text x="16" y="527" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#D7DAE0" xml:space="preserve">    p50 22.07 ms   p95 30.82 ms   p99 37.08 ms   max 328.04 ms</text><text x="16" y="546" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#D7DAE0" xml:space="preserve">    throughput 4293.2 req/s</text><text x="16" y="565" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#D7DAE0" xml:space="preserve"></text><text x="16" y="584" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#D7DAE0" xml:space="preserve">--- comparacion con los objetivos declarados ---</text><text x="16" y="603" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6FCF83" xml:space="preserve">  catalogo  p95   17.15 ms  CUMPLE    throughput  31920.3 req/s  CUMPLE    errores 0%  CUMPLE</text><text x="16" y="622" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6FCF83" xml:space="preserve">  catalogoInterno p95   11.69 ms  CUMPLE    throughput  11381.9 req/s  CUMPLE    errores 0%  CUMPLE</text><text x="16" y="641" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6FCF83" xml:space="preserve">  grpc      p95   30.18 ms  CUMPLE    throughput   3739.7 req/s  CUMPLE    errores 0%  CUMPLE</text><text x="16" y="660" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6FCF83" xml:space="preserve">  rest      p95   30.82 ms  CUMPLE    throughput   4293.2 req/s  CUMPLE    errores 0%  CUMPLE</text><text x="16" y="679" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#D7DAE0" xml:space="preserve"></text><text x="16" y="698" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#D7DAE0" xml:space="preserve">  gRPC vs REST en la misma operacion: p95 30.18 ms contra 30.82 ms (-2.1% para gRPC)</text><text x="16" y="717" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#D7DAE0" xml:space="preserve">  CPU del proceso de prueba: 25145 ms usuario, 2789 ms sistema</text><text x="16" y="736" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#D7DAE0" xml:space="preserve">  Memoria RSS del proceso de prueba: 79 MB -&gt; 250 MB</text><text x="16" y="755" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#D7DAE0" xml:space="preserve"></text><text x="16" y="774" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#D7DAE0" xml:space="preserve">Nota: la medicion corre en la misma maquina que los servicios, asi que</text><text x="16" y="793" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#D7DAE0" xml:space="preserve">incluye el costo del propio generador de carga. Sirve para comparar los</text><text x="16" y="812" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#D7DAE0" xml:space="preserve">tres escenarios entre si, no como cifra de produccion.</text></svg>