" fill="#6FCF83" xml:space="preserve">  ✔ 9. el login no permite enumerar cuentas (clients) (28.335167ms)</text><text x="16" y="1040" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6FCF83" xml:space="preserve">  ✔ 10. cerrar sesion revoca el token (auth + api-gateway) (28.855791ms)</text><text x="16" y="1059" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6FCF83" xml:space="preserve">  ✔ 11. no hay secretos en la respuesta publica de rutas (api-gateway) (0.578167ms)</text><text x="16" y="1078" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6FCF83" xml:space="preserve">  ✔ 12. una ruta interna no esta publicada (api-gateway) (0.857375ms)</text><text x="16" y="1097" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6FCF83" xml:space="preserve">  ✔ 13. el registro rechaza un RUN con digito verificador invalido (clients) (1.284041ms)</text><text x="16" y="1116" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6FCF83" xml:space="preserve">✔ Modulo 7 - casos de validacion (319.981ms)</text><text x="16" y="1135" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#E8C06F" xml:space="preserve">ℹ tests 45</text><text x="16" y="1154" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#E8C06F" xml:space="preserve">ℹ suites 5</text><text x="16" y="1173" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#E8C06F" xml:space="preserve">ℹ pass 45</text><text x="16" y="1192" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#E8C06F" xml:space="preserve">ℹ fail 0</text><text x="16" y="1211" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#E8C06F" xml:space="preserve">ℹ cancelled 0</text><text x="16" y="1230" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#E8C06F" xml:space="preserve">ℹ skipped 0</text><text x="16" y="1249" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#E8C06F