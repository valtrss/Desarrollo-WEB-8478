mar pedido reserva stock y queda pendiente de pago (3.859709ms)</text><text x="16" y="223" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6FCF83" xml:space="preserve">  ✔ RF2 - el pedido no entra a preparacion antes del pago (36.982958ms)</text><text x="16" y="242" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6FCF83" xml:space="preserve">  ✔ RF2 - iniciar pago toma el monto de orders, no del navegador (2.681125ms)</text><text x="16" y="261" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6FCF83" xml:space="preserve">  ✔ seguridad - una notificacion con firma invalida se rechaza (2.067583ms)</text><text x="16" y="280" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6FCF83" xml:space="preserve">  ✔ seguridad - una notificacion con monto alterado se rechaza (1.798208ms)</text><text x="16" y="299" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6FCF83" xml:space="preserve">  ✔ RF2 - el pago confirmado pasa el pedido a pagado (87.576667ms)</text><text x="16" y="318" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6FCF83" xml:space="preserve">  ✔ idempotencia - la misma notificacion repetida no hace nada nuevo (1.4005ms)</text><text x="16" y="337" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6FCF83" xml:space="preserve">  ✔ RF8 - se emitio la boleta del pedido (1.828584ms)</text><text x="16" y="356" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6FCF83" xml:space="preserve">  ✔ RF13 - el pedido pagado aparece en la cola de despacho (70.075208ms)</text><text x="16" y="375" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6FCF83" xml:space="preserve">  ✔ Modulo 8 - resumenPedido agrega orders, inventory y clients (5.302417ms)</text><text x="16" y="394" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6FCF83" xml:space="preserve">  ✔ RF3 - anular conserva el pedido y registra el motivo (3.839375ms)</text><text x="16" y="413" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6FCF83" xml:space="preserve">✔ Flujo de compra completo (264.874458ms)</text><text x="16" y="432" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#D7DAE0" xml:space="preserve">▶ Compra como invitado</text><text x="16" y="451" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6FCF83" xml:space="preserve">  ✔ el correo de contacto se valida (4.399666ms)</text><text x="16" y="470" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6FCF83" xml:space="preserve">  ✔ un invitado compra sin cuenta y recibe su boleta (25.988ms)</text><text x="16" y="489" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6FCF83" xml:space="preserve">  ✔ dos invitados con el mismo correo no comparten historial (12.708625ms)</text><text x="16" y="508" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6FCF83" xml:space="preserve">  ✔ un invitado no puede entrar al panel de administracion (1.756458ms)</text><text x="16" y="527" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6FCF83" xml:space="preserve">✔ Compra como invitado (49.846959ms)</text><text x="16" y="546" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#D7DAE0" xml:space="preserve">▶ Promocion de primera compra</text><text x="16" y="565" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6FCF83" xml:space="preserve">  ✔ se crea y verifica una cuenta nueva (155.976375ms)</text><text x="16" y="584" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6FCF83" xml:space="preserve">  ✔ la primera compra lleva 5% de descuento (6.916625ms)</text><text x="16" y="603" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6FCF83" xml:space="preserve">  ✔ la segunda compra ya no lleva descuento (5.961292ms)</text><text x="16" y="622" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6FCF83" xml:space="preserve">  ✔ el descuento no se puede reclamar desde el navegador (6.7255ms)</text><text x="16" y="641" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6FCF83" xml:space="preserve">✔ Promocion de primera compra (175.762292ms)</text><text x="16" y="660" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#D7DAE0" xml:space="preserve">▶ RF9 - Reporte de ventas</text><text x="16" y="679" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6FCF83" xml:space="preserve">  ✔ una venta pagada ahora entra en el reporte del dia local (116.487708ms)</text><text x="16" y="698" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6FCF83" xml:space="preserve">  ✔ el reporte no entrega datos personales de clientes (1.862125ms)</text><text x="16" y="717" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6FCF83" xml:space="preserve">  ✔ el rango de consulta esta acotado (2.99975ms)</text><text x="16" y="736" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6FCF83" xml:space="preserve">  ✔ un cliente no puede ver el reporte (55.974208ms)</text><text x="16" y="755" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6FCF83" xml:space="preserve">✔ RF9 - Reporte de ventas (182.494959ms)</text><text x="16" y="774" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#D7DAE0" xml:space="preserve">▶ Modulo 7 - casos de validacion</text><text x="16" y="793" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6FCF83" xml:space="preserve">  ✔ 1. acceso anonimo al catalogo: permitido (api-gateway) (4.701083ms)</text><text x="16" y="812" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6FCF83" xml:space="preserve">  ✔ 2. operacion protegida sin sesion: 401 (api-gateway) (1.641083ms)</text><text x="16" y="831" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6FCF83" xml:space="p