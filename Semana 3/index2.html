<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Practica 2 | Ruta Platino</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<main class="container my-5">
    <h1 class="h3">Practica 2 &#8212; Listado generado desde JavaScript</h1>
    <p class="text-body-secondary">
        Las mismas tarjetas de la Semana 2, pero construidas con <code>createElement</code>
        a partir de una respuesta simulada de la API. El select filtra sin recargar la pagina.
    </p>

    <div class="row align-items-end mb-4">
        <div class="col-12 col-md-4">
            <label for="cmbPlataforma" class="form-label">Plataforma</label>
            <!-- El select se crea desde JavaScript y se inserta aqui -->
            <div id="filtro"></div>
        </div>
        <div class="col-12 col-md-8 mt-2 mt-md-0">
            <p class="mb-0 text-body-secondary" id="contador" aria-live="polite"></p>
        </div>
    </div>

    <!-- Las tarjetas se insertan aqui -->
    <div class="row g-4" id="listado"></div>

    <p class="mt-4"><a href="index.html" class="btn btn-outline-primary">Volver a la practica 1</a></p>
</main>

<script src="practica2.js"></script>
</body>
</html>
