<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catalogo - La Nonna</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/estilos.css" rel="stylesheet">
</head>
<body>

<!-- Rayas de la grilla de 12 columnas, igual que el boceto -->
<div class="nonna-rayas" aria-hidden="true"></div>

<nav class="navbar navbar-expand-lg nonna-navbar">
  <div class="container">
    <a class="navbar-brand nonna-marca" href="/">LA NONNA</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/">Inicio</a></li>
        <li class="nav-item"><a class="nav-link active" href="/catalogo.html">Catalogo</a></li>
      </ul>
      <div id="zona-sesion" class="d-flex align-items-center"></div>
    </div>
  </div>
</nav>

<main class="container py-4">
  <nav aria-label="ruta" class="small text-secondary mb-2">Inicio / Catalogo</nav>

  <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
    <div>
      <h1 class="h2 mb-1">Catalogo de pastas frescas</h1>
      <p class="text-secondary mb-0"><span id="total-resultados">0</span> productos</p>
    </div>
    <div style="min-width: 260px;">
      <label class="form-label small text-secondary mb-1" for="buscador">Buscar</label>
      <input class="form-control" id="buscador" type="search" placeholder="Ravioles, pesto, pack...">
    </div>
  </div>

  <div id="aviso" class="d-none"></div>

  <div class="row g-4">
    <!-- FILTROS: col-3 en escritorio, acordeon plegado en movil -->
    <aside class="col-lg-3">
      <div class="nonna-card p-3">
        <h2 class="h5 mb-3">Filtrar</h2>

        <fieldset class="mb-3">
          <legend class="h6">Categoria</legend>
          <div id="filtro-categorias" class="small text-secondary">Cargando...</div>
        </fieldset>

        <fieldset class="mb-3">
          <legend class="h6">Formato</legend>
          <div id="filtro-formatos" class="small"></div>
        </fieldset>

        <fieldset class="mb-3">
          <legend class="h6">Disponibilidad</legend>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="solo-disponibles" checked>
            <label class="form-check-label small" for="solo-disponibles">Solo disponible hoy</label>
          </div>
        </fieldset>

        <button class="btn btn-nonna w-100" id="btn-filtrar">Aplicar filtros</button>
        <button class="btn btn-link w-100 mt-1 text-decoration-none" id="btn-limpiar">Limpiar</button>
      </div>
    </aside>

    <!-- RESULTADOS: col-9 -> 3 por fila, 2 en tablet, 1 en movil -->
    <section class="col-lg-9">
      <div class="row g-3" id="resultados">
        <div class="col-12 text-secondary">Cargando catalogo...</div>
      </div>

      <nav class="d-flex justify-content-center mt-4">
        <ul class="pagination" id="paginacion"></ul>
      </nav>
    </section>
  </div>
</main>

<footer class="nonna-footer py-4 mt-5">
  <div class="container">
    <p class="small text-secondary mb-0">Pastas Frescas La Nonna &middot; Desarrollo Web 8478</p>
  </div>
</footer>

<script type="module" src="/js/catalogo.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
